# mpv config — Bangla-ready defaults
# Copy to ~/.config/mpv/mpv.conf
hwdec=auto-safe
vo=gpu
# Big cache so live streams stop stuttering on slow connections
cache=yes
demuxer-max-bytes=256M
demuxer-readahead-secs=30
# On-screen display: readable size, shows title + time
osd-font-size=28
osd-duration=3000
osd-level=1
# Keep audio in sync on network streams
audio-buffer=1
# Best quality for YouTube-style URLs (needs yt-dlp installed)
ytdl-format=bestvideo[height<=1080]+bestaudio/best
# Remember position when reopening a file
save-position-on-quit=yes
